---
 - hosts: webservers
   become: true
   tasks:
     - name: Install httpd
       yum:
         name: httpd
         state: present

     - name: copy index.html
       copy:
         src: index.html
         dest: /var/www/html/index.html
       notify:
         start httpd server

   handlers:      
     - name: start httpd server
       service:
         name: httpd
         state: started